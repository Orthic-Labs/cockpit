# Smoke: the debug qa-native hub launches hidden under rightkit-control, renders its shell on the Overview
# section and exits cleanly. Maps to floor id smoke.launch (right-release.config.mjs).
# Same launch as launch_hub() in hub/qa-e2e/tests/ui.rs.
name = "app.launch"
tier = "fast"
target = "ui"

[[step]]
kind = "write_file"
label = "fixture home (the scenario data dir): one folder for Storage to list"
path = "alpha-folder/fixture.txt"
content = "pulse release QA fixture"

[[step]]
kind = "ui_launch"
label = "launch the hub hidden"
mode = "hidden"
  [step.env]
  RIGHTKIT_PULSE_QA_HOME = "${data_dir}"
  [[step.expect]]
  path = "health.ok"
  eq = true

[[step]]
kind = "ui_wait_eval"
label = "navigation rendered"
timeout_s = 30
js = 'return !!document.querySelector("nav.rk-nav")'

[[step]]
kind = "ui_eval"
label = "Overview is the opening section"
js = 'return document.querySelector(".rk-top__title")?.textContent?.trim() ?? ""'
  [[step.expect]]
  eq = "Overview"

[[step]]
kind = "ui_screenshot"
name = "launch-overview"

[[step]]
kind = "ui_stop"
label = "hub exits and its control endpoint closes"
  [[step.expect]]
  path = "endpoint_closed"
  eq = true
  [[step.expect]]
  path = "process_gone"
  eq = true
