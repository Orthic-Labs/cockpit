function appsView(){shellTitle('Apps');if(mode==='loading')return commonState('Reading applications…','Checking sizes & last use');if(mode==='error')return commonState('Apps could not be read','Permission denied · review retained')+btn('Open Full Disk Access','permission');if(mode==='empty'&&appDetail)return commonState('No associated files reported','Return to apps or refresh','back');if(appDetail)return appReview();let shown=mode==='empty'?[]:apps.filter(a=>!uninstalled.has(a.name)&&(filter!=='unused'||a.unused)&&(filter!=='running'||a.running)&&a.name.toLowerCase().includes(query.toLowerCase()));return `<div class="head"><label for="app-search">Search apps</label>${btn('Refresh','rescan')}</div><input id="app-search" class="field" type="search" placeholder="Name or bundle id" value="${escapeHtml(query)}"><div class="segments" aria-label="Filter apps">${[['all','All'],['unused','Unused 90+ days'],['running','Running']].map(([v,t])=>`<button data-filter="${v}" aria-pressed="${filter===v}">${t}</button>`).join('')}</div><p class="sub">${shown.length} of ${mode==='empty'?0:apps.filter(a=>!uninstalled.has(a.name)).length} apps · ${gb(shown.reduce((n,a)=>n+a.size,0))} measured · largest first</p>${mode==='partial'?'<div class="notice warn">Last use incomplete · sizes measured</div>':''}<div class="card scroll" tabindex="0" aria-label="Installed apps">${shown.map(a=>`<button class="app-row" data-app="${a.name}"><span class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 8h8v8H8z"/></svg></span><span><strong>${a.name}</strong> ${a.running?badge('Running'):a.protected?badge('Protected'):''}<span class="sub" style="display:block">Last used: ${a.used}</span></span><span class="num">${gb(a.size)}</span></button>`).join('')||'<div class="state"><h2>No matching apps</h2><p class="sub">Clear filters or refresh applications.</p>'+btn('Clear filters','clear-filters')+'</div>'}</div>`}
function appReview(){const xs=appChoices();let running=selectedApp.running||mode==='running',protectedApp=selectedApp.protected||mode==='protected';return `<div class="head">${btn('Back to apps','back')}<div><h2>${selectedApp.name}</h2><p class="sub">Last used: ${mode==='partial'?'Unknown':selectedApp.used}</p></div></div><div class="notice ${protectedApp?'error':running?'warn':''}">${protectedApp?'Protected · removal unavailable':running?'Running · must quit before moving':'Not running'}</div>${mode==='stale'?'<div class="notice warn">Cached review · refresh before moving '+btn('Refresh review','retry')+'</div>':''}${mode==='partial'?'<div class="notice warn">Last used: Unknown</div>':''}${notice?'<div class="notice" role="status">'+notice+(mode==='partial'&&appRemoved.size?'<div class="actions">'+btn('Review failed paths','retry-app')+'</div>':'')+'</div>':''}<div class="scroll card" tabindex="0" aria-label="Associated files">${['Application','User Library','System Library'].map(loc=>{let rows=leftovers.filter(i=>i.location===loc&&!appRemoved.has(i.id));return rows.length?`<section><div class="section-head"><h3>${loc} · ${rows.length}</h3>${btn('Deselect group','deselect:'+loc)}</div>${rows.map(i=>`<div class="row"><label><span class="check"><input type="checkbox" data-related="${i.id}" ${appPicked.has(i.id)?'checked':''} ${protectedApp?'disabled':''}></span><div><strong class="path">${i.id==='application'?'/Applications/'+selectedApp.name+'.app':i.path.replace(/Sketch/g,selectedApp.name).replace('com.bohemiancoding.sketch3',selectedApp.name==='Sketch'?'com.bohemiancoding.sketch3':'com.example.'+selectedApp.name.toLowerCase().replace(/ /g,''))}</strong><p class="sub">${i.consequence}${i.admin?' · Admin required':''}</p>${badge('Match: '+i.confidence)} ${!i.preselected?badge('Review consequence','warn'):''}</div></label><span class="num">${gb(i.id==='application'?selectedApp.size:i.size)}</span></div>`).join('')}</section>`:''}).join('')}<details><summary>Background items & receipts</summary><p class="sub">Example helper · informational</p><p class="sub">com.example.package · informational</p></details></div><footer class="selection"><div><strong>${xs.length} selected · ${measured(xs)}</strong> ${badge('measured')}<span class="sub">${xs.some(i=>i.admin)?'Admin required · ':''}${running?'Must quit · ':''}Restore in Finder</span></div>${btn('Move to Trash','app-move','danger',protectedApp||!xs.length||mode==='stale')}</footer>`}
function accounts(){return group('Logins Cockpit reads', accountOrder.map((id,i)=>setting(id==='codex'?'Codex':id==='claude'?'Claude':'Cursor',id==='cursor'?'Not connected':mode==='partial'&&id==='claude'?'Access refused · reading unknown':'Reading app login',`<div class="reorder">${btn('↑','up:'+id,'',i===0)}${btn('↓','down:'+id,'',i===2)}</div>${switchControl(id,'Show '+id)}`)+`<div class="actions">${id==='cursor'?btn('Open Cursor to sign in','sign-in'):mode==='partial'&&id==='claude'?btn('Allow access…','allow-access'):btn('Forget reading','forget:'+id)}</div>`).join(''))}
function general(){return group('Startup',setting('Open Cockpit at login','',switchControl('login','Open Cockpit at login')))+group('Uninstalling',setting('Uninstall without password',desired.helper?'Requested on · needs approval':'Off · admin required',switchControl('helper','Uninstall without password'))+setting('Allow Cockpit in background','Login Items',btn('Open Login Items','login-items')))+group('Launcher',setting('Enable launcher','Apps, files & commands',switchControl('launcher','Enable launcher'))+(desired.launcher?setting('Shortcut',mode==='partial'?'Conflict · choose another shortcut':'Command Space needs Spotlight change',`<select aria-label="Launcher shortcut"><option>Option Space</option><option>Command Space</option></select>`):''))+group('Keyboard',setting('Fn works as Command',mode==='partial'?'Requested on · needs Accessibility':'Requested on · running',switchControl('fn','Fn works as Command')))+group('Conveniences',setting('Accessibility',mode==='partial'?'Not allowed · features inactive':'Allowed',mode==='partial'?btn('Open System Settings','accessibility'):badge('Allowed','ok'))+setting('Cut & paste in Finder','⌘X to mark · ⌘V to move',switchControl('finder','Cut & paste in Finder'))+(mode==='partial'?'<div class="notice error">Paste denied · original retained</div>':'')+setting('Green button maximizes','Fills screen',switchControl('zoom','Green button maximizes'))+setting('Dock click minimizes','Frontmost app windows',switchControl('dock','Dock click minimizes'))+setting('Offer to install & eject','One-app disk images',switchControl('installer','Offer to install & eject'))+(desired.installer?setting('Move downloaded DMG to Trash','After install · off by default',switchControl('dmg','Move downloaded DMG to Trash')):'')+setting('Auto Quit',mode==='partial'?'Requested on · needs Accessibility':'Listed apps after last window closes',switchControl('auto','Auto Quit'))+(desired.auto?`<details open><summary>Edit Auto Quit list · ${autoApps.length} apps</summary>${autoApps.map(a=>setting(a,'',btn('Remove','remove-auto:'+a))).join('')}${setting('Add running app','',`<select id="auto-app" aria-label="App to add"><option>Example Editor</option><option>Calculator</option></select>${btn('Add','add-auto')}`)}</details>`:''))+group('Readings',setting('Ask provider every time you look','Uses one request per look',switchControl('requests','Ask provider every time you look'))+setting('Refresh readings','',btn('Refresh now','readings')))+'<p class="caption">Codenotch · MIT</p>'}
function settings(){shellTitle(settingsPane[0].toUpperCase()+settingsPane.slice(1));if(['loading','error','empty'].includes(mode)){let messages={loading:['Reading settings…','Waiting for current values'],error:['Settings unavailable','Connection failed · preferences retained'],empty:['No settings reported','Refresh connection']};return commonState(...messages[mode])}return `${mode==='partial'?'<div class="notice warn">Permissions pending · features inactive</div>':''}${notice?'<div class="notice" role="status">'+notice+'</div>':''}<div class="scroll" tabindex="0" aria-label="Settings groups">${settingsPane==='accounts'?accounts():settingsPane==='appearance'?group('Appearance',setting('Surface','',`<select aria-label="Surface"><option>Dark glass</option><option>Light glass</option></select>`)+setting('Position','',btn('Reset position','reset-position'))):settingsPane==='notifications'?group('Notifications',setting('Channel','',`<select aria-label="Notification channel"><option>Notch</option><option>System</option></select>`)+setting('Try notifications','',btn('Send a test','notification'))):general()}</div>`}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const html=screen==='storage'?storage():screen==='cleanup'?cleanup():screen==='monitor'?monitor():screen==='apps'?appsView():settings();$('#content').innerHTML=html;$('#about-copy').innerHTML=aboutNumbers();$$('[data-group]').forEach(input=>{let xs=findings.filter(f=>eligible(f)&&f.risk===input.dataset.group),n=xs.filter(f=>chosen.has(f.id)).length;input.checked=!!xs.length&&n===xs.length;input.indeterminate=n>0&&n<xs.length;input.disabled=!xs.length});$$('[data-action^="up:"]').forEach(b=>b.setAttribute('aria-label','Move '+b.dataset.action.split(':')[1]+' up'));$$('[data-action^="down:"]').forEach(b=>b.setAttribute('aria-label','Move '+b.dataset.action.split(':')[1]+' down'))}
function openDialog(title,description,action,danger=false){previousFocus=document.activeElement;pendingAction=action;$('#dialog-title').textContent=title;$('#dialog-copy').innerHTML=description.split(/\.\s+/).map(t=>`<span class="dialog-clause">${escapeHtml(t)}</span>`).join('');$('#dialog-confirm').textContent=danger&&typeof action==='string'&&action.startsWith('force:')?'Force Quit':'Move to Trash';$('#dialog-confirm').className=danger?'btn-danger':'btn-primary';$('#dialog').showModal();$('#dialog-cancel').focus()}
function closeDialog(){let d=$('#dialog');d.close();previousFocus?.focus()}
function move(xs){xs=xs.filter(eligible);if(!xs.length)return;const failed=mode==='partial'?xs.at(-1):null,moved=xs.filter(f=>f!==failed);moved.forEach(f=>{removed.add(f.id);chosen.delete(f.id)});if(moved.length)history.push({title:'Just now',items:moved.map(f=>({...f,trash_path:'Trash/'+f.id,restored:false})),failed:failed?failed.name+' · identity changed':null});notice=`${moved.length} moved · ${measured(moved)} measured${failed?' · '+failed.name+' skipped (identity changed)':''}`;render()}
function restore(index){let h=history[index];if(!h)return;const xs=h.items.filter(i=>!i.restored);if(!xs.length)return;if(mode==='restore-error'||failedRestore){failedRestore=true;notice='Restore blocked · destination exists';render();return}const failed=mode==='partial'?xs.at(-1):null;xs.filter(i=>i!==failed).forEach(i=>{i.restored=true;removed.delete(i.id)});failedRestore=!!failed;notice=`${xs.length-(failed?1:0)} restored${failed?' · 1 conflict remains in Trash':''}`;render()}
function action(a){if(a==='retry'||a==='rescan'){mode='ready';$('#state').value='ready';notice='Refreshed · eligibility rechecked';chosen=new Set([...chosen].filter(id=>findings.some(f=>f.id===id&&eligible(f))));render()}
else if(a==='move'||a==='move-safe'||a.startsWith('move-one:')){if(mode==='stale'){notice='Rescan before moving';render();return}let xs=a==='move-safe'?findings.filter(f=>eligible(f)&&f.risk==='safe'):a.startsWith('move-one:')?findings.filter(f=>f.id===a.slice(9)&&eligible(f)):selection();openDialog(`Move ${xs.length} items to Trash?`,`${measured(xs)} measured. ${xs.some(f=>f.risk==='review')?'Review includes your files. ':''}Identity & eligibility rechecked. Restore from Trash. Free-space gain unknown.`,()=>move(xs))}
else if(a==='history'){pane='history';render()}
else if(a==='restore-last')restore(history.length-1);else if(a.startsWith('restore:'))restore(Number(a.split(':')[1]));else if(a==='retry-restore'){failedRestore=false;mode='ready';$('#state').value='ready';restore(history.length-1)}
else if(a==='eject'){notice='Installer ejected';render()}
else if(a==='home'){folder='home';pane='folders';query='';render()}
else if(a.startsWith('folder:')){const name=a.slice(7),from=pane==='changes'?folderData:(folderRows.get(folder)||folderData),entry=from.find(f=>f.name===name),next=(pane==='changes'||folder==='home')?name:folder+' / '+name;if(entry&&!folderRows.has(next)){const first=Math.round(entry.value*6)/10;folderRows.set(next,[{name:'Contents',value:first,delta:'—'},{name:'Other',value:entry.value-first,delta:'—'}])}folder=next;pane='folders';query='';render()}
else if(a.startsWith('process:')){openProc=openProc===a.slice(8)?null:a.slice(8);render()}
else if(a.startsWith('quit:')){let key=a.slice(5);if(key.startsWith('chrome')){stuck.add(key);notice='Chrome still running after Quit'}else{quitDone.add(key);notice='App quit'}render()}
else if(a.startsWith('force:')){const key=a.slice(6),p=processes.find(p=>p.key===key);openDialog('Force Quit '+p.name+'?','Ends app immediately. Unsaved work may be lost. Process key, PID & start time must match.',a,true)}
else if(a==='back'){saveApp();appDetail=false;render()}
else if(a.startsWith('deselect:')){leftovers.filter(i=>i.location===a.slice(9)).forEach(i=>appPicked.delete(i.id));render()}
else if(a==='app-move'){let xs=appChoices();openDialog(`Move ${xs.length} selected items to Trash?`,`${measured(xs)} measured. Match is association only. ${xs.some(i=>!i.preselected)?'User-created or shared files selected. ':''}${xs.some(i=>i.admin)?'Admin required. ':''}${selectedApp.running||mode==='running'?'Must quit before moving. ':''}Restore in Finder. Free-space gain unknown.`,()=>{if(selectedApp.running||mode==='running'){notice='App stayed open · nothing moved'}else{const moved=mode==='partial'?xs.slice(0,-1):xs;moved.forEach(i=>{appRemoved.add(i.id);appPicked.delete(i.id);if(i.id==='application')uninstalled.add(selectedApp.name)});saveApp();notice=`${moved.length} moved · ${measured(moved)} measured${mode==='partial'?' · 1 failed (permission denied)':''}`}render()},true)}
else if(a==='retry-app'){notice='Failed paths retained for retry';mode='ready';$('#state').value='ready';render()}
else if(a==='clear-filters'){query='';filter='all';mode='ready';$('#state').value='ready';render()}
else if(a.startsWith('switch:')){let id=a.slice(7);desired[id]=!desired[id];notice='Preference updated';render()}
else if(a.startsWith('remove-auto:')){autoApps=autoApps.filter(x=>x!==a.slice(12));render()}
else if(a==='add-auto'){let app=$('#auto-app').value;if(!autoApps.includes(app))autoApps.push(app);render()}
else if(a.startsWith('forget:')){notice='Cached reading forgotten';render()}
else if(a.startsWith('up:')||a.startsWith('down:')){const [dir,id]=a.split(':'),i=accountOrder.indexOf(id),j=i+(dir==='up'?-1:1);if(j>=0&&j<accountOrder.length)[accountOrder[i],accountOrder[j]]=[accountOrder[j],accountOrder[i]];notice='Ring order updated';render()}
else {notice=({'permission':'Grant Full Disk Access & rescan','accessibility':'Grant Accessibility & refresh','allow-access':'Retry Keychain access','login-items':'Approve helper in Login Items','sign-in':'Sign in through provider app','readings':'Refresh requested','notification':'Notification preview requested'})[a]||'Mock action requested';render()}}
$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-pane],[data-sort],[data-filter],[data-app]');if(!b||b.disabled)return;if(b.dataset.action)action(b.dataset.action);else if(b.dataset.pane){pane=b.dataset.pane;render()}else if(b.dataset.sort){sort=b.dataset.sort;render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.app)openApp(b.dataset.app)});
$('#content').addEventListener('change',e=>{let t=e.target;if(t.dataset.finding){let f=findings.find(f=>f.id===t.dataset.finding);if(eligible(f)){t.checked?chosen.add(f.id):chosen.delete(f.id)}render()}else if(t.dataset.group){findings.filter(f=>eligible(f)&&f.risk===t.dataset.group).forEach(f=>t.checked?chosen.add(f.id):chosen.delete(f.id));render()}else if(t.dataset.related){t.checked?appPicked.add(t.dataset.related):appPicked.delete(t.dataset.related);render()}else if(t.id==='drive'){volume=t.value;render()}});
$('#content').addEventListener('input',e=>{if(e.target.id==='app-search'||e.target.id==='folder-search'){let id=e.target.id;query=e.target.value;render();$('#'+id).focus();}});
// Restore focus after dynamic updates using stable semantic control keys, never row positions.
const originalRender=render;render=function(){const el=document.activeElement;const attrs=['data-action','data-finding','data-group','data-related','data-pane','data-sort','data-filter','data-app'];let attr=attrs.find(k=>el?.hasAttribute(k)),value=attr?el.getAttribute(attr):null;const scroll=$('.scroll')?.scrollTop||0;originalRender();if($('.scroll'))$('.scroll').scrollTop=scroll;const target=attr?$$('['+attr+']').find(n=>n.getAttribute(attr)===value):el?.id?document.getElementById(el.id):null;if(target&&!target.disabled)target.focus({preventScroll:true});else if(attr||(el&&el.closest?.('#content')))($('.scroll')||$('#content button'))?.focus({preventScroll:true})};
$('#dialog-cancel').onclick=closeDialog;$('#dialog-confirm').onclick=()=>{const act=pendingAction;closeDialog();if(typeof act==='function')act();else if(act?.startsWith('force:')){quitDone.add(act.slice(6));notice='Force Quit completed';render()}};
$('#dialog').addEventListener('cancel',()=>{pendingAction=null});$('#dialog').addEventListener('close',()=>previousFocus?.focus());
$$('[data-theme-choice]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.themeChoice;$$('[data-theme-choice]').forEach(t=>t.setAttribute('aria-pressed',t===b));});
$('#about').addEventListener('keydown',e=>{if(e.key==='Escape'){$('#about').open=false;$('#about summary').focus()}});
document.addEventListener('click',e=>{if(!e.target.closest('#about'))$('#about').open=false});
$('#size').onchange=e=>{const small=e.target.value==='small';document.documentElement.style.setProperty('--ck-width',small?'820px':'900px');document.documentElement.style.setProperty('--ck-height',small?'520px':'600px');$('.win').dataset.size=small?'small':'default'};
$('#state').onchange=e=>{mode=e.target.value;notice='';failedRestore=false;if(mode==='restore-error'){pane='history';if(!history.length)history.push({title:'Yesterday',items:[{...findings[0],trash_path:'Trash/derived',restored:false}]});removed.add('derived');chosen.delete('derived');failedRestore=true}if(mode==='partial'&&screen==='settings')desired.launcher=true;if(['running','protected'].includes(mode)&&screen==='apps'){selectedApp=apps[2];appDetail=true}render()};
$$('[data-settings]').forEach(a=>a.onclick=e=>{if(screen==='settings'){e.preventDefault();settingsPane=a.dataset.settings;$$('.nav a').forEach(n=>n.removeAttribute('aria-current'));a.setAttribute('aria-current','page');render()}});
render();
</script></body></html>
