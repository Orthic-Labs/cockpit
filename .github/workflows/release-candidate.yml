# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/release-candidate.yml | Template version: 1.8.0
# Dispatch-only release chain binds every stage to one admitted main revision.
name: release-candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer to qualify or publish
        required: true
        type: string
      source_revision:
        description: Exact 40-character lowercase main commit SHA
        required: true
        type: string
      signed_qualification:
        description: Run protected signing, installed qualification, & evidence verification
        required: false
        type: boolean
        default: false
      publish:
        description: Publish only after same-run signed qualification verifies
        required: false
        type: boolean
        default: false
      dry_run:
        description: Rehearse packaging, signing & installed qualification from a branch with publication skipped
        required: false
        type: boolean
        default: false
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  admission:
    needs: [private-repo-guard]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.admit.outputs.version }}
      source_revision: ${{ steps.admit.outputs.source_revision }}
      signed_qualification: ${{ steps.admit.outputs.signed_qualification }}
      publish: ${{ steps.admit.outputs.publish }}
      dry_run: ${{ steps.admit.outputs.dry_run }}
      artifact_suffix: ${{ steps.admit.outputs.artifact_suffix }}
    steps:
      - name: Validate immutable dispatch envelope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            [[ "$GITHUB_REF" == refs/heads/* ]]
            [[ "${{ inputs.publish }}" != "true" ]]
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          fi
          [[ "${{ inputs.version }}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${{ inputs.source_revision }}" =~ ^[a-f0-9]{40}$ ]]
          if [[ "${{ inputs.publish }}" == "true" ]]; then [[ "${{ inputs.signed_qualification }}" == "true" ]]; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Admit exact main revision & version
        id: admit
        run: pnpm run release:admit
        env:
          GH_TOKEN: ${{ github.token }}
          RIGHT_GIT_RELEASE_VERSION: ${{ inputs.version }}
          RIGHT_GIT_SOURCE_REVISION: ${{ inputs.source_revision }}
          RIGHT_GIT_SIGNED_QUALIFICATION: ${{ inputs.signed_qualification }}
          RIGHT_GIT_PUBLISH: ${{ inputs.publish }}
          RIGHT_GIT_DRY_RUN: ${{ inputs.dry_run }}
          RIGHT_GIT_WORKFLOW_REF: ${{ github.ref }}
          RIGHT_GIT_RUN_ATTEMPT: ${{ github.run_attempt }}
  candidate:
    needs: [admission]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-26"
            node: "26.8.1"
            platform: "macos"
            architecture: "arm64"
            targetTriple: "aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admission.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.targetTriple }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            windows -> target
          shared-key: cockpit-rust
          add-job-id-key: false
          cache-workspace-crates: false
          cache-on-failure: true
          save-if: true
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"
      - run: pnpm install --frozen-lockfile
      - name: Initialize candidate stage summary
        run: pnpm run release:summary
        env:
          RIGHT_GIT_STAGE_ACTION: init
          RIGHT_GIT_STAGE_ROOT: ${{ runner.temp }}/right-git-stage-summary
          RIGHT_GIT_STAGE_EVIDENCE_ROOT: ${{ runner.temp }}/cockpit-candidate
          RIGHT_GIT_STAGE: candidate
          RIGHT_GIT_STAGE_PRODUCER: candidate-${{ matrix.platform }}-${{ matrix.architecture }}
          RIGHT_GIT_RELEASE_VERSION: ${{ needs.admission.outputs.version }}
          RIGHT_GIT_SOURCE_REVISION: ${{ needs.admission.outputs.source_revision }}
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RIGHT_GIT_RUN_ID: ${{ github.run_id }}
          RIGHT_GIT_RUN_ATTEMPT: ${{ github.run_attempt }}
      - name: Build unsigned release candidate
        run: pnpm run release:candidate
        env:
          RIGHT_GIT_ARTIFACT_ROOT: ${{ runner.temp }}/cockpit-candidate
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RIGHT_GIT_SOURCE_REVISION: ${{ needs.admission.outputs.source_revision }}
      - name: Check unsigned release candidate
        run: pnpm run release:check
        env:
          RIGHT_GIT_ARTIFACT_ROOT: ${{ runner.temp }}/cockpit-candidate
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RIGHT_GIT_SOURCE_REVISION: ${{ needs.admission.outputs.source_revision }}
      - name: Finalize candidate stage summary
        if: ${{ always() }}
        run: pnpm run release:summary
        env:
          RIGHT_GIT_STAGE_ACTION: finalize
          RIGHT_GIT_STAGE_ROOT: ${{ runner.temp }}/right-git-stage-summary
          RIGHT_GIT_STAGE_EVIDENCE_ROOT: ${{ runner.temp }}/cockpit-candidate
          RIGHT_GIT_STAGE: candidate
          RIGHT_GIT_STAGE_PRODUCER: candidate-${{ matrix.platform }}-${{ matrix.architecture }}
          RIGHT_GIT_STAGE_STATUS: ${{ job.status == 'success' && 'SUCCEEDED' || 'FAILED' }}
          RIGHT_GIT_STAGE_EXIT_CODE: ${{ job.status == 'success' && '0' || '1' }}
          RIGHT_GIT_RELEASE_VERSION: ${{ needs.admission.outputs.version }}
          RIGHT_GIT_SOURCE_REVISION: ${{ needs.admission.outputs.source_revision }}
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RIGHT_GIT_RUN_ID: ${{ github.run_id }}
          RIGHT_GIT_RUN_ATTEMPT: ${{ github.run_attempt }}
      - name: Upload unsigned candidate handoff
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-${{ github.run_id }}-${{ github.run_attempt }}-candidate-${{ matrix.platform }}-${{ matrix.architecture }}-${{ needs.admission.outputs.version }}-${{ needs.admission.outputs.source_revision }}
          path: ${{ runner.temp }}/cockpit-candidate/**
          if-no-files-found: error
      - name: Upload candidate stage summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-${{ github.run_id }}-${{ github.run_attempt }}-summary-candidate-${{ matrix.platform }}-${{ matrix.architecture }}-${{ needs.admission.outputs.version }}-${{ needs.admission.outputs.source_revision }}
          path: ${{ runner.temp }}/right-git-stage-summary/stage-summary.json
          if-no-files-found: error


  macos-sign:
    needs: [admission, candidate]
    if: ${{ needs.admission.outputs.signed_qualification == 'true' }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "macos-26"
            platform: "macos"
            architecture: "arm64"
            targetTriple: "aarch64-apple-darwin"
            node: "26.8.1"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admission.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        with:
          targets: ${{ matrix.targetTriple }}
      - run: pnpm install --frozen-lockfile
      - name: Initialize macOS signing stage summary
        run: pnpm run release:summary
        env:
          RIGHT_GIT_STAGE_ACTION: init
          RIGHT_GIT_STAGE_ROOT: ${{ runner.temp }}/right-git-stage-summary
          RIGHT_GIT_STAGE_EVIDENCE_ROOT: ${{ runner.temp }}/finalized-macos
          RIGHT_GIT_STAGE: macos-sign
          RIGHT_GIT_STAGE_PRODUCER: macos-sign-${{ matrix.architecture }}
          RIGHT_GIT_RELEASE_VERSION: ${{ needs.admission.outputs.version }}
          RIGHT_GIT_SOURCE_REVISION: ${{ needs.admission.outputs.source_revision }}
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RIGHT_GIT_RUN_ID: ${{ github.run_id }}
          RIGHT_GIT_RUN_ATTEMPT: ${{ github.run_attempt }}
      - name: Download exact unsigned macOS candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cockpit-${{ github.run_id }}-${{ github.run_attempt }}-candidate-${{ matrix.platform }}-${{ matrix.architecture }}-${{ needs.admission.outputs.version }}-${{ needs.admission.outputs.source_revision }}
          path: ${{ runner.temp }}/unsigned-macos-candidate
      - name: Install Apple signing identity in temporary keychain
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/apple-signing.p12"
          key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          printf 'APPLE_API_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"
      - name: Sign, notarize & finalize macOS candidate
        run: pnpm exec right-release build --platform mac --skip-checks
        env:
          LEGION_UNSIGNED_CANDIDATE_ROOT: ${{ runner.temp }}/unsigned-macos-candidate
          LEGION_SOURCE_REVISION: ${{ env.RIGHT_GIT_SOURCE_REVISION }}
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Finalize macOS signing stage summary
        if: ${{ always() }}
        run: pnpm run release:summary
        env:
          RIGHT_GIT_STAGE_ACTION: finalize
          RIGHT_GIT_STAGE_ROOT: ${{ runner.temp }}/right-git-stage-summary
          RIGHT_GIT_STAGE_EVIDENCE_ROOT: ${{ runner.temp }}/finalized-macos
          RIGHT_GIT_STAGE: macos-sign
          RIGHT_GIT_STAGE_PRODUCER: macos-sign-${{ matrix.architecture }}
          RIGHT_GIT_STAGE_STATUS: ${{ job.status == 'success' && 'SUCCEEDED' || 'FAILED' }}
          RIGHT_GIT_STAGE_EXIT_CODE: ${{ job.status == 'success' && '0' || '1' }}
          RIGHT_GIT_RELEASE_VERSION: ${{ needs.admission.outputs.version }}
          RIGHT_GIT_SOURCE_REVISION: ${{ needs.admission.outputs.source_revision }}
          RIGHT_GIT_RELEASE_PLATFORM: ${{ matrix.platform }}
          RIGHT_GIT_RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
          RIGHT_GIT_RUN_ID: ${{ github.run_id }}
          RIGHT_GIT_RUN_ATTEMPT: ${{ github.run_attempt }}
      - name: Upload signed & notarized macOS candidate
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-${{ github.run_id }}-${{ github.run_attempt }}-signed-macos-${{ matrix.architecture }}-${{ needs.admission.outputs.version }}-${{ needs.admission.outputs.source_revision }}
          path: |
            dist/releases/mac/**
            .right-release/receipts/macos-*.json
          if-no-files-found: error
      - name: Upload macOS signing stage summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-${{ github.run_id }}-${{ github.run_attempt }}-summary-macos-sign-${{ matrix.architecture }}-${{ needs.admission.outputs.version }}-${{ needs.admission.outputs.source_revision }}
          path: ${{ runner.temp }}/right-git-stage-summary/stage-summary.json
          if-no-files-found: error
      - name: Remove Apple signing material
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-signing.p12" "$RUNNER_TEMP/AuthKey.p8"
