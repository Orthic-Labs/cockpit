# Managed by right-git — do not hand-edit. Run `right-git sync` to update.
# Template: profiles/rust-hybrid/ci.yml | Template version: 1.8.0
name: pulse-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-repo-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse private repository
        if: ${{ github.event.repository.private }}
        run: exit 1
  ci:
    needs: [private-repo-guard]
    strategy:
      fail-fast: false
      matrix:
        # ciAllOs: the gate runs on every matrix.os runner, in declared order.
        os: ["xcode-27", "windows-2025"]
        node: ["26.8.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Rust-affecting changes
        id: rust-changes
        shell: bash
        env:
          RIGHT_GIT_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          changed=true
          base="$RIGHT_GIT_DIFF_BASE"
          if [[ "$base" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "$base" =~ ^0{40}$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if changed_paths="$(git diff --name-only --diff-filter=ACDMRTUXB "$base" "$GITHUB_SHA")"; then
              changed=false
              while IFS= read -r changed_path; do
                case "$changed_path" in
                  *.rs|Cargo.toml|*/Cargo.toml|Cargo.lock|*/Cargo.lock|rust-toolchain|*/rust-toolchain|rust-toolchain.toml|*/rust-toolchain.toml|.cargo/*|*/.cargo/*|.rightgit.json|.github/workflows/*.yml|.github/workflows/*.yaml|scripts/gate.sh)
                    changed=true
                    break
                    ;;
                esac
              done <<< "$changed_paths"
            fi
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
          required="$changed"
          if [[ "true" == "true" ]]; then
            required=true
          fi
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile

      - name: RightKit ownership (protected registry roots)
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}" && pnpm exec right-release ownership --app . --advisory-when-pending
      - name: Cache Xcode DerivedData
        if: ${{ runner.os == 'macOS' }}
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ matrix.os }}-deriveddata-${{ hashFiles('**/Cargo.lock', '**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-deriveddata-
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0
        if: steps.rust-changes.outputs.required == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.rust-changes.outputs.required == 'true'
        with:
          workspaces: |
            . -> target
            windows -> target
            hub/src-tauri -> target
          shared-key: pulse-rust
          add-job-id-key: false
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.rust-changes.outputs.required == 'true'
        with:
          version: "v0.16.0"
      - run: bash ./scripts/gate.sh
        env:
          RIGHT_GIT_RUST_CHANGED: ${{ steps.rust-changes.outputs.changed }}
          RIGHT_GIT_RUST_REQUIRED: ${{ steps.rust-changes.outputs.required }}
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: ""
          CARGO_INCREMENTAL: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-evidence-${{ matrix.os || runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pulse-hub-qa
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload unsigned dev build (Windows)
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && runner.os == 'Windows' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-windows-${{ github.sha }}
          path: dist/dev/windows/**
          retention-days: 7
          if-no-files-found: error
      - name: Package unsigned dev app (macOS)
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && runner.os == 'macOS' }}
        shell: bash
        env:
          DEV_APP_PATH: "dist/dev/Pulse.app"
        run: |
          set -euo pipefail
          test -d "$DEV_APP_PATH"
          mkdir -p "$RUNNER_TEMP/dev-unsigned"
          ditto -c -k --keepParent "$DEV_APP_PATH" "$RUNNER_TEMP/dev-unsigned/app.zip"
      - name: Upload unsigned dev app for signing (macOS)
        if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && runner.os == 'macOS' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-unsigned-mac-${{ github.sha }}
          path: ${{ runner.temp }}/dev-unsigned/app.zip
          retention-days: 1
          if-no-files-found: error

  dev-mac-sign:
    # Push to the default branch only. The release environment's protection
    # rules (required reviewers, branch policy) apply to this job.
    needs: [ci]
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    environment: release
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Download unsigned dev app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dev-unsigned-mac-${{ github.sha }}
          path: ${{ runner.temp }}/dev-unsigned
      - name: Install Apple signing identity in temporary keychain
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/apple-signing.p12"
          keychain_path="$RUNNER_TEMP/apple-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
      - name: Developer ID sign dev app (no notarization)
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ vars.APPLE_DEVELOPER_ID }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dev-sign"
          rm -rf "$work" && mkdir -p "$work"
          ditto -x -k "$RUNNER_TEMP/dev-unsigned/app.zip" "$work"
          app="$(find "$work" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --force --deep --strict --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID" "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p "$RUNNER_TEMP/dev-signed"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/dev-signed/$(basename "$app").zip"
      - name: Upload signed (not notarized) dev app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-mac-${{ github.sha }}
          path: ${{ runner.temp }}/dev-signed/*.zip
          retention-days: 7
          if-no-files-found: error
      - name: Remove Apple signing material
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-signing.p12"
