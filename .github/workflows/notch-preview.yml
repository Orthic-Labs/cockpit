# Cockpit-owned (not managed by right-git): builds the Codenotch-fork notch and
# uploads an ad-hoc-signed Cockpit.app for trying on a Mac. Not a release.
name: notch-preview
on:
  push:
    branches: [main]
    paths: ["mac/Notch/**", ".github/workflows/notch-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notch-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          xcodebuild -version
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec mac/Notch/project.yml --project mac/Notch
      - name: Build
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/notch-build.log"
          if ! xcodebuild -project mac/Notch/Cockpit.xcodeproj -scheme Cockpit -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build > "$log" 2>&1; then
            grep -E "error:" "$log" | sort -u | head -n 150 || true
            tail -n 40 "$log"
            exit 1
          fi
      - name: Ad-hoc sign and zip
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Release/Cockpit.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Cockpit-preview.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit-notch-preview
          path: ${{ runner.temp }}/Cockpit-preview.zip
          if-no-files-found: error
          retention-days: 7
