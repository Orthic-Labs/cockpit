[workspace]
members = ["core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = ">=1.0.145, <2" # root lock holds 1.0.145; the lock-less hub needs >=1.0.150 for rightkit-control
thiserror = "=2.0.17"
libc = "=0.2.177"
sysinfo = "=0.37.2"
# Nearby sharing (LocalSend protocol v2). Not yet in the lock: run `cargo update -w` once.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
