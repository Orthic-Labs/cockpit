<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Cockpit — storage</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="identity">
          <div class="mark" aria-hidden="true">C</div>
          <div>
            <p class="kicker">Cockpit</p>
            <h1>Storage desk</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="status-chip" id="scan-status" data-tone="neutral">No scan loaded</span>
          <input id="scan-file" type="file" accept="application/json,.json" hidden />
          <button class="button button-primary" id="import-scan" type="button">Import scan JSON</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Cockpit sections">
          <nav id="section-nav" class="section-nav">
            <p class="nav-label">Inspect</p>
            <button class="nav-item is-active" data-view="storage" type="button" aria-current="page"><span aria-hidden="true">▦</span>Storage</button>
            <button class="nav-item" data-view="find" type="button"><span aria-hidden="true">⌕</span>Find</button>
            <button class="nav-item" data-view="duplicates" type="button"><span aria-hidden="true">◫</span>Duplicates</button>
            <p class="nav-label nav-label-spaced">Review</p>
            <button class="nav-item" data-view="cleanup" type="button"><span aria-hidden="true">✓</span>Cleanup</button>
            <button class="nav-item" data-view="apps" type="button"><span aria-hidden="true">⌘</span>Apps</button>
            <button class="nav-item" data-view="monitor" type="button"><span aria-hidden="true">◉</span>Monitor</button>
            <button class="nav-item" data-view="activity" type="button"><span aria-hidden="true">↗</span>Activity</button>
            <button class="nav-item" data-view="compress" type="button"><span aria-hidden="true">↓</span>Compress</button>
          </nav>
          <div class="sidebar-footer">
            <p>Typed local evidence</p>
            <p>Native actions ask for confirmation</p>
          </div>
        </aside>

        <main id="main-content" class="main-content" tabindex="-1">
          <div id="app-view"></div>
        </main>
      </div>
    </div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
