# Marks hub/ as its own pnpm workspace root, separate from the repo-root workspace.
packages:
  - "."
# Exact versions only, reviewed: RightKit's own release. Drop once it is older
# than the release-age window.
minimumReleaseAgeExclude:
  - '@rightkit/app-shell@0.4.1'
  - '@rightkit/platform-ui@0.2.0'
