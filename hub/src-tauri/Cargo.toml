[package]
name = "cockpit-hub"
version = "0.1.0"
description = "Cockpit hub: storage and monitor window opened from the notch"
edition = "2021"
rust-version = "1.98.0"
publish = false

[lib]
name = "cockpit_hub"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cockpit-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Debug-only in-app control server for headless QA (`rightkit-qa`). Never enabled by release builds.
qa-native = ["dep:rightkit-control"]
# Embed the built frontend instead of the dev server (what `tauri build` turns on).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
rightkit-control = { version = "=0.1.3", features = ["tauri-plugin"], optional = true }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cockpit-core = { path = "../../core" }
trash = "=5.2.9"
tauri-plugin-os = "2"

[dev-dependencies]
rightkit-qa = "=0.2.3"
serde_json = "1"

# The hub is its own workspace so the core's locked workspace stays unchanged.
[workspace]
