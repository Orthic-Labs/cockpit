[package]
name = "pulse-hub"
version = "0.1.0"
description = "Pulse hub: storage and monitor window opened from the notch"
edition = "2021"
rust-version = "1.98.0"
publish = false

[lib]
name = "pulse_hub"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pulse-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Debug-only in-app control server for headless QA (`rightkit-qa`). Never enabled by release builds.
qa-native = ["dep:rightkit-control"]
# Embed the built frontend instead of the dev server (what `tauri build` turns on).
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
rightkit-control = { version = "=0.1.6", features = ["tauri-plugin"], optional = true }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulse-core = { path = "../../core" }
trash = "=5.2.9"
tauri-plugin-os = "2"

# Whole-disk name index and folder sizes (FSEvents, getattrlistbulk). Content search stays off:
# the `content` feature is deliberately not enabled.
[target.'cfg(target_os = "macos")'.dependencies]
rightkit-fsindex = "0.1.0"

# Uninstall-key inventory for the Apps page (apps_windows.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# The hub is its own workspace so the core's locked workspace stays unchanged.
[workspace]
