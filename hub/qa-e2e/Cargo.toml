[package]
name = "pulse-hub-qa"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
publish = false
description = "Headless QA of the Pulse hub on rightkit-qa: drives the debug qa-native build through rightkit-control."

# Its own workspace: rightkit-qa's exact pins (e.g. windows =0.61.1) cannot resolve
# next to pulse-core's (windows =0.61.3), so this must not share the hub's resolution.
[workspace]

[dev-dependencies]
# Held at 0.2.12: under 0.2.14 the Windows hub journey loses hover on the Storage "Folders" radio
# and then cannot find the controls after it (reported to RightKit 2026-10-11); the Mac leg is fine.
rightkit-qa = "=0.2.12"
serde_json = "1"
